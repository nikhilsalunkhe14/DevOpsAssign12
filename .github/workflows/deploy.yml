name: Deploy Django App to AWS Swarm

on:
  push:
    branches:
      - ITB735 # 

jobs:
  deploy:
    runs-on: ubuntu-latest # Use a standard GitHub-hosted runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Gets your repository code

      # Docker Hub Login (Optional but Recommended)
      # If your Docker Hub account is private or you hit rate limits, uncomment this
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }} # Your .pem key content

      - name: Add Manager IP to known_hosts
        run: ssh-keyscan -H ${{ secrets.MANAGER_IP }} >> ~/.ssh/known_hosts

      - name: Build and Deploy via SSH
        run: |
          # SSH into the manager node and run the build/deploy commands
          ssh ubuntu@${{ secrets.MANAGER_IP }} << 'EOF'
            cd ~/aws-devops-project/docker
            # Build the image explicitly on the manager
            docker build -t django-app:latest -f Dockerfile ../
            # Deploy the stack
            docker stack deploy -c docker-compose.yml myapp
            # Optional: Wait a bit for services to stabilize before migrations
            sleep 30
            # Find a running web container ID
            WEB_CONTAINER_ID=$(docker ps --filter "name=myapp_web" --format "{{.ID}}" | head -n 1)
            # Run migrations if a container ID was found
            if [ -n "$WEB_CONTAINER_ID" ]; then
              echo "Running migrations on container $WEB_CONTAINER_ID..."
              docker exec $WEB_CONTAINER_ID python3 /app/manage.py migrate
            else
              echo "Warning: No running web container found to run migrations."
            fi
          EOF